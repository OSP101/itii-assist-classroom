# =============================================================================
# Prometheus Config - DEV SERVER
# Scrapes backend via Docker container name (itii-dev-backend)
# Prometheus + Alertmanager อยู่ใน itii-network เดียวกับ backend
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "itii-alertmanager-dev:9093"

scrape_configs:
  # Prometheus self
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Backend (Docker container บน itii-network)
  - job_name: "backend"
    metrics_path: "/api/metrics/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["itii-dev-backend:3001"]
        labels:
          service: "backend"
          environment: "development"

  # Loki self-monitoring
  - job_name: "loki"
    static_configs:
      - targets: ["itii-loki-dev:3100"]
        labels:
          service: "loki"

  # Node Exporter - Host CPU, RAM, Disk, Network
  # node-exporter ใช้ network_mode: host จึงต้อง scrape ผ่าน host.docker.internal
  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: "node-exporter"
          environment: "development"

  # cAdvisor - Container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["itii-cadvisor-dev:8080"]
        labels:
          service: "cadvisor"
          environment: "development"
