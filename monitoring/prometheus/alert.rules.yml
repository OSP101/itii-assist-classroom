# =============================================================================
# Prometheus Alert Rules
# Triggers alerts for: CPU, RAM, Disk, Website down, Container restarts
# =============================================================================

groups:
  # ===========================================================================
  # Server Health Alerts
  # ===========================================================================
  - name: server_health
    rules:
      # -----------------------------------------------------------------------
      # CPU usage > 85% for 5 minutes
      # -----------------------------------------------------------------------
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          service: server
        annotations:
          summary: "High CPU usage detected ({{ $labels.instance }})"
          description: "CPU usage is above 85% (current: {{ $value | printf \"%.1f\" }}%) for more than 5 minutes."

      # -----------------------------------------------------------------------
      # CPU usage > 95% for 2 minutes (critical)
      # -----------------------------------------------------------------------
      - alert: CriticalCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          service: server
        annotations:
          summary: "Critical CPU usage ({{ $labels.instance }})"
          description: "CPU usage is above 95% (current: {{ $value | printf \"%.1f\" }}%). Immediate attention required."

      # -----------------------------------------------------------------------
      # RAM usage > 90%
      # -----------------------------------------------------------------------
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: server
        annotations:
          summary: "High memory usage detected ({{ $labels.instance }})"
          description: "Memory usage is above 90% (current: {{ $value | printf \"%.1f\" }}%)."

      # -----------------------------------------------------------------------
      # RAM usage > 95% (critical)
      # -----------------------------------------------------------------------
      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          service: server
        annotations:
          summary: "Critical memory usage ({{ $labels.instance }})"
          description: "Memory usage is above 95% (current: {{ $value | printf \"%.1f\" }}%). System may become unresponsive."

      # -----------------------------------------------------------------------
      # Disk usage > 90%
      # -----------------------------------------------------------------------
      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: server
        annotations:
          summary: "High disk usage detected ({{ $labels.instance }})"
          description: "Disk usage is above 90% (current: {{ $value | printf \"%.1f\" }}%). Consider cleanup or expansion."

      # -----------------------------------------------------------------------
      # Disk usage > 95% (critical)
      # -----------------------------------------------------------------------
      - alert: CriticalDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 95
        for: 2m
        labels:
          severity: critical
          service: server
        annotations:
          summary: "Critical disk usage ({{ $labels.instance }})"
          description: "Disk usage is above 95% (current: {{ $value | printf \"%.1f\" }}%). Server may run out of space soon."

      # -----------------------------------------------------------------------
      # High load average (above CPU count for 10 minutes)
      # -----------------------------------------------------------------------
      - alert: HighLoadAverage
        expr: node_load1 / count without(cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 10m
        labels:
          severity: warning
          service: server
        annotations:
          summary: "High load average detected ({{ $labels.instance }})"
          description: "Load average is 1.5x the CPU count for more than 10 minutes."

  # ===========================================================================
  # Website Health Alerts
  # ===========================================================================
  - name: website_health
    rules:
      # -----------------------------------------------------------------------
      # Website/API down for > 1 minute
      # -----------------------------------------------------------------------
      - alert: WebsiteDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: website
        annotations:
          summary: "Website/API is DOWN"
          description: "The backend service has been unreachable for more than 1 minute. Immediate action required."

      # -----------------------------------------------------------------------
      # High HTTP error rate (>5% of requests are 5xx)
      # -----------------------------------------------------------------------
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m])) /
          sum(rate(http_requests_total[5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
          service: website
        annotations:
          summary: "High HTTP error rate"
          description: "More than 5% of HTTP requests are returning 5xx errors (current: {{ $value | printf \"%.1f\" }}%)."

      # -----------------------------------------------------------------------
      # High API latency (p95 > 2 seconds)
      # -----------------------------------------------------------------------
      - alert: HighApiLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          service: website
        annotations:
          summary: "High API latency detected"
          description: "95th percentile API latency is above 2 seconds (current: {{ $value | printf \"%.2f\" }}s)."

  # ===========================================================================
  # Container Health Alerts
  # ===========================================================================
  - name: container_health
    rules:
      # -----------------------------------------------------------------------
      # Container restarted more than 3 times in 15 minutes
      # -----------------------------------------------------------------------
      - alert: ContainerRestarting
        expr: increase(container_restart_count[15m]) > 3
        for: 0m
        labels:
          severity: warning
          service: container
        annotations:
          summary: "Container {{ $labels.name }} restarting frequently"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last 15 minutes."

      # -----------------------------------------------------------------------
      # Container using > 90% of its memory limit
      # -----------------------------------------------------------------------
      - alert: ContainerHighMemory
        expr: |
          (container_memory_usage_bytes{name!=""} /
           container_spec_memory_limit_bytes{name!=""}) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: container
        annotations:
          summary: "Container {{ $labels.name }} high memory usage"
          description: "Container {{ $labels.name }} is using > 90% of its memory limit."

      # -----------------------------------------------------------------------
      # Container stopped/not running
      # -----------------------------------------------------------------------
      - alert: ContainerDown
        expr: absent(container_last_seen{name=~"itii-prod-.*"})
        for: 1m
        labels:
          severity: critical
          service: container
        annotations:
          summary: "Production container is down"
          description: "A production container is not running. Check docker status."
