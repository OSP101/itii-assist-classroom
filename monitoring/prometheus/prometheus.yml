# =============================================================================
# Prometheus Configuration
# Scrape targets: Node Exporter, cAdvisor, Backend /metrics, Loki
# =============================================================================

global:
  scrape_interval: 15s          # Scrape every 15 seconds
  evaluation_interval: 15s       # Evaluate rules every 15 seconds
  scrape_timeout: 10s

# Alert rules file
rule_files:
  - "alert.rules.yml"

# Alertmanager endpoint
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "itii-alertmanager:9093"

# =============================================================================
# Scrape Targets
# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # ---------------------------------------------------------------------------
  # Node Exporter - Server hardware metrics (CPU, RAM, disk, network)
  # ---------------------------------------------------------------------------
  - job_name: "node-exporter"
    static_configs:
      - targets: ["itii-node-exporter:9100"]
        labels:
          service: "node-exporter"
          environment: "production"

  # ---------------------------------------------------------------------------
  # cAdvisor - Docker container metrics
  # ---------------------------------------------------------------------------
  - job_name: "cadvisor"
    static_configs:
      - targets: ["itii-cadvisor:8080"]
        labels:
          service: "cadvisor"
          environment: "production"

  # ---------------------------------------------------------------------------
  # Backend application metrics (Express /metrics endpoint)
  # Runs on the itii-network so Prometheus can reach it
  # ---------------------------------------------------------------------------
  - job_name: "backend"
    metrics_path: "/api/metrics/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["itii-prod-backend:3001"]
        labels:
          service: "backend"
          environment: "production"

  # ---------------------------------------------------------------------------

  # Loki metrics
  # ---------------------------------------------------------------------------
  - job_name: "loki"
    static_configs:
      - targets: ["itii-loki:3100"]
        labels:
          service: "loki"
