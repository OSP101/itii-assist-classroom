# =============================================================================
# Grafana Dashboard Provisioning
# Auto-loads dashboards from /var/lib/grafana/dashboards on startup
# =============================================================================
apiVersion: 1

providers:
  - name: "ITII Dashboards"
    orgId: 1
    folder: "ITII Monitoring"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
