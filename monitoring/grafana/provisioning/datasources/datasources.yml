# =============================================================================
# Grafana Datasource Provisioning
# Auto-configures Prometheus + Loki on first boot
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://itii-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"

  - name: Loki
    type: loki
    access: proxy
    url: http://itii-loki:3100
    editable: false
