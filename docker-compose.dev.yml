services:
  redis:
    image: redis:7-alpine
    container_name: itii-dev-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - itii-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
      timeout: 3s
    restart: always

  backend:
    build: 
      context: ./back-end
    image: itii-backend:dev
    container_name:  itii-dev-backend
    env_file:
      - ./back-end/.env.dev
    environment:
      NODE_ENV: development
      DB_HOST: itii-mysql
      DB_PORT: 3306
      REDIS_HOST: itii-dev-redis
      REDIS_PORT: 6379
    ports:
      - "3001:3001"
    networks:
      - itii-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 30s
    restart: always

  frontend:
    build: 
      context: ./front-end
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}
        NEXT_PUBLIC_CLOUD: ${NEXT_PUBLIC_CLOUD}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    image: itii-frontend:dev
    container_name:  itii-dev-frontend
    env_file:
      - ./front-end/.env.local.dev
    ports:
      - "3000:3000"
    depends_on: 
      backend:
        condition:  service_healthy
    networks: 
      - itii-network
    restart: always

networks:
  itii-network:  
    external: true

volumes:
  redis-dev-data: