services:
  redis:
    image: redis:7-alpine
    container_name: itii-prod-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod-data:/data
    networks:
      - itii-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
      timeout: 3s
    restart: always

  backend:
    build:
      context: ./back-end
    image: itii-backend:prod
    container_name: itii-prod-backend
    env_file:
      - ./back-end/.env.prod
    environment:
      NODE_ENV: production
      DB_HOST: itii-mysql
      DB_PORT: 3306
      REDIS_HOST: itii-prod-redis
      REDIS_PORT: 6379
    restart: always
    ports:
      - "3011:3001"
    group_add:
      - "988"    # docker group GID — ให้ expressjs user อ่าน docker.sock ได้
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - itii-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 30s

  frontend:
    build: 
      context: ./front-end
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}
        NEXT_PUBLIC_CLOUD: ${NEXT_PUBLIC_CLOUD}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    image: itii-frontend:prod
    container_name: itii-prod-frontend
    restart: always
    env_file:
      - ./front-end/.env.local.prod
    ports:
      - "3010:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - itii-network

networks:
  itii-network:
    external: true

volumes:
  redis-prod-data: