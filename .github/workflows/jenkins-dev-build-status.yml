name: Jenkins Dev Build Status

on:
  push:
    branches:
      - main
      - final
  pull_request:
    branches:
      - main
      - final
  workflow_dispatch:

concurrency:
  group: jenkins-dev-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-dev:
    name: Build (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare temporary env files
        shell: bash
        run: |
          cat > back-end/.env.dev <<'EOF'
          DB_NAME=ci_db
          DB_USER=ci_user
          DB_PASSWORD=ci_password
          JWT_ACCESS_SECRET=ci_access_secret
          JWT_REFRESH_SECRET=ci_refresh_secret
          GOOGLE_CLIENT_ID=ci_google_client_id
          GOOGLE_CLIENT_SECRET=ci_google_client_secret
          GOOGLE_CALLBACK_URL=http://localhost:3001/api/auth/google/callback
          GITHUB_CLIENT_ID=ci_github_client_id
          GITHUB_CLIENT_SECRET=ci_github_client_secret
          GITHUB_CALLBACK_URL=http://localhost:3001/api/auth/github/callback
          FRONTEND_URL=http://localhost:3000
          JWT_ACCESS_EXPIRES_IN=1h
          JWT_REFRESH_EXPIRES_IN=7d
          FIREBASE_SERVICE_ACCOUNT={}
          RESEND_API_KEY=ci_resend_api_key
          SMTP_FROM=noreply@example.com
          PROMETHEUS_URL=http://localhost:9090
          ALERT_WEBHOOK_SECRET=ci_webhook_secret
          EOF

          cat > front-end/.env.local.dev <<'EOF'
          NEXT_PUBLIC_API_URL=http://localhost:3001/api
          NEXT_PUBLIC_SOCKET_URL=http://localhost:3001
          NEXT_PUBLIC_FRONTEND_URL=http://localhost:3000
          NEXT_PUBLIC_CLOUD=ci_cloud
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=ci_google_client_id
          NEXT_PUBLIC_FIREBASE_API_KEY=ci_firebase_api_key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000
          NEXT_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:000000000000
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=ci_vapid_key
          EOF

          cat > .env <<'EOF'
          NEXT_PUBLIC_API_URL=http://localhost:3001/api
          NEXT_PUBLIC_SOCKET_URL=http://localhost:3001
          NEXT_PUBLIC_FRONTEND_URL=http://localhost:3000
          NEXT_PUBLIC_CLOUD=ci_cloud
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=ci_google_client_id
          NEXT_PUBLIC_FIREBASE_API_KEY=ci_firebase_api_key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000
          NEXT_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:000000000000
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=ci_vapid_key
          EOF

      - name: Build with docker compose (Jenkins parity)
        run: docker compose -p itii-dev -f docker-compose.dev.yml build --no-cache

      - name: Show image summary
        if: always()
        run: docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | head -n 20
